<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="商品・メニューの販売価格と材料原価から、原価率・粗利・粗利率を即座に計算し、目標原価率からの必要販売価格を逆算できる無料のWebツールです。">
  <title>原価率らくらく計算 - 販売価格・原価率・粗利・目標逆算シミュレーター</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="badge-wrapper">
        <span class="badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          登録不要・ブラウザ完結
        </span>
      </div>
      <h1 class="app-title">原価率らくらく計算</h1>
      <p class="app-subtitle">材料原価の積み上げ集計・原価率＆粗利の自動計算・目標原価率からの逆算シミュレーター</p>
    </header>

    <!-- Presets -->
    <section class="presets-section" aria-label="プリセットレシピ">
      <span class="preset-label">サンプル例:</span>
      <button type="button" class="preset-btn" data-preset="hamburg">🍳 ハンバーグ定食</button>
      <button type="button" class="preset-btn" data-preset="caffe_latte">☕ カフェラテ</button>
      <button type="button" class="preset-btn" data-preset="cake">🍰 ショートケーキ</button>
      <button type="button" class="preset-btn" data-preset="handmade">👜 布製トートバッグ</button>
    </section>

    <!-- Main Grid -->
    <main class="layout-grid">
      <!-- Left Column: Inputs -->
      <section class="inputs-column">
        <!-- Product & Sales Price Card -->
        <div class="card">
          <h2 class="card-title">
            <span>1. 商品 & 販売価格</span>
          </h2>
          <div class="form-group">
            <label for="product-name" class="form-label">商品・メニュー名</label>
            <input type="text" id="product-name" class="form-input" placeholder="例: 特製ハンバーグランチ">
          </div>

          <div class="form-group">
            <label for="selling-price" class="form-label">販売価格 (税込/税抜)</label>
            <div class="input-with-unit">
              <input type="number" id="selling-price" class="form-input has-unit" placeholder="1000" min="0" step="1">
              <span class="input-unit">円</span>
            </div>
            <div class="chip-row">
              <button type="button" class="quick-chip" data-val="500">¥500</button>
              <button type="button" class="quick-chip" data-val="800">¥800</button>
              <button type="button" class="quick-chip" data-val="1000">¥1,000</button>
              <button type="button" class="quick-chip" data-val="1200">¥1,200</button>
              <button type="button" class="quick-chip" data-val="1500">¥1,500</button>
              <button type="button" class="quick-chip" data-val="2000">¥2,000</button>
            </div>
          </div>

          <div class="form-group">
            <label for="target-cost-rate" class="form-label">目標原価率 (逆算用・任意)</label>
            <div class="input-with-unit">
              <input type="number" id="target-cost-rate" class="form-input has-unit" placeholder="30" min="1" max="100" step="0.5">
              <span class="input-unit">%</span>
            </div>
            <div class="chip-row">
              <button type="button" class="quick-chip" data-target="20">20% (高収益)</button>
              <button type="button" class="quick-chip" data-target="25">25% (カフェ等)</button>
              <button type="button" class="quick-chip" data-target="30">30% (飲食標準)</button>
              <button type="button" class="quick-chip" data-target="35">35% (目玉商品)</button>
              <button type="button" class="quick-chip" data-target="40">40% (集客商品)</button>
            </div>
          </div>
        </div>

        <!-- Materials Card -->
        <div class="card">
          <div class="card-title">
            <span>2. 材料・原価明細</span>
            <span id="material-count-badge" class="badge" style="font-size: 0.72rem; padding: 2px 8px;">0件</span>
          </div>

          <div id="materials-container" class="material-list" aria-label="材料一覧">
            <!-- Dynamic Material Items -->
          </div>

          <button type="button" id="btn-add-material" class="btn-add-material">
            + 材料を追加する
          </button>
        </div>
      </section>

      <!-- Right Column: Results -->
      <aside class="results-column">
        <div class="card results-card">
          <h2 class="card-title">計算結果サマリー</h2>

          <!-- Main Gauge -->
          <div class="cost-rate-gauge">
            <div class="gauge-label">原価率</div>
            <div id="res-cost-rate" class="gauge-value">0.0<span style="font-size: 1.4rem;">%</span></div>
            <div id="res-gauge-badge" class="gauge-status-badge">販売価格を入力してください</div>
          </div>

          <!-- Metrics 2x2 Grid -->
          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-label">合計商品原価</div>
              <div id="res-total-cost" class="metric-val emerald">¥0</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">販売価格</div>
              <div id="res-selling-price" class="metric-val">¥0</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">粗利益額</div>
              <div id="res-gross-profit" class="metric-val blue">¥0</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">粗利益率</div>
              <div id="res-gross-profit-rate" class="metric-val">0.0%</div>
            </div>
          </div>

          <!-- Target Reverse Calc Box -->
          <div id="reverse-calc-box" class="reverse-calc-box">
            <div class="reverse-calc-header">
              <span>🎯 目標原価率からの必要販売価格</span>
              <span id="res-target-rate-label">目標 30%</span>
            </div>
            <div id="res-target-selling-price" class="reverse-calc-val">¥0</div>
            <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 4px;">
              ※ 原価を維持したまま目標原価率を達成するための逆算値
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="action-buttons">
            <button type="button" id="btn-copy-result" class="btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              計算結果をテキストコピー
            </button>
            <button type="button" id="btn-clear-all" class="btn-secondary">
              入力をリセット
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>&copy; 2026 原価率らくらく計算 | <a href="LICENSE" target="_blank">MIT License</a> | ブラウザ完結・データ送信なし</p>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- JavaScript Scripts (Zero-dependency & CORS-free for file:// & http://) -->
  <script src="js/units.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
